# Wöchentlicher Neubau der Images für Basis-Image-Updates (A-030, Betrieb 4): derselbe Ablauf wie die CI auf master.
name: Images wöchentlich neu bauen

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  neubau:
    runs-on: ubuntu-latest
    steps:
      - name: CI für master auslösen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref master
