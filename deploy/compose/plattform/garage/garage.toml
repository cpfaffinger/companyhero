# Garage (A-029): S3-kompatibler Objektspeicher für Medien mit signierten URLs; nur im internen Netz.
# Ein Knoten zum Start (Betrieb 2.2); die Replikation wird beim Übergang zu mehreren Hosts erhöht.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
metadata_auto_snapshot_interval = "6h"

replication_factor = 1
consistency_mode = "consistent"

compression_level = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"
rpc_secret_file = "/run/secrets/garage_rpc_secret"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.internal"

[admin]
api_bind_addr = "[::]:3903"
admin_token_file = "/run/secrets/garage_admin_token"
