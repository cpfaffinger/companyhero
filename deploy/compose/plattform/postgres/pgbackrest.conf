# pgBackRest (A-031): Basissicherung täglich, WAL-Archivierung fortlaufend (archive_timeout 300 s ergibt RPO 15 min),
# Verschlüsselung im Repository, Aufbewahrung höchstens 35 Tage (A-024).
# Das Repository-Ziel ist Konfiguration der Umgebung (Umgebungsvariablen PGBACKREST_REPO1_*):
#   Produktion: S3-kompatibler Speicher am zweiten Standort des Betreibers (TLS)
#   Lokal, CI, Wiederherstellungsübung: posix-Repository auf einem eigenen Volume als Stellvertreter des Offsite-Speichers
[global]
repo1-type=posix
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=35
repo1-retention-archive-type=full
repo1-bundle=y
repo1-block=y
compress-type=zst
process-max=2
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest
spool-path=/var/spool/pgbackrest
archive-async=y
start-fast=y
delta=y

[main]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
