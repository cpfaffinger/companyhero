<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Onboarding: Erstes Abzeichen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#FCFCFF;color:#1A1B21}
a{color:#2A45C9}a:hover{color:#05157A}

.ch-stack > *{animation:ch-rise 320ms cubic-bezier(.2,.7,.2,1) both}
.ch-stack > :nth-child(2){animation-delay:50ms}.ch-stack > :nth-child(3){animation-delay:100ms}.ch-stack > :nth-child(4){animation-delay:150ms}.ch-stack > :nth-child(5){animation-delay:200ms}.ch-stack > :nth-child(6){animation-delay:250ms}.ch-stack > :nth-child(7){animation-delay:300ms}.ch-stack > :nth-child(8){animation-delay:350ms}.ch-stack > :nth-child(9){animation-delay:400ms}.ch-stack > :nth-child(10){animation-delay:450ms}
.ch-fill{animation:ch-fill 900ms cubic-bezier(.2,.7,.2,1) 200ms both}
.ch-ring{animation:ch-ring 1000ms cubic-bezier(.2,.7,.2,1) 250ms both}
.ch-num{animation:ch-num 600ms cubic-bezier(.2,.7,.2,1) 500ms both}
.ch-next{animation:ch-pip 2400ms ease-in-out 1400ms infinite}
.ch-pop{animation:ch-pop 520ms cubic-bezier(.2,.9,.3,1.15) 100ms both}
.ch-glow{animation:ch-glow 1000ms ease-out 900ms both}
button,a{transition:background-color 120ms ease,color 120ms ease,border-color 120ms ease,transform 120ms ease,box-shadow 120ms ease,filter 120ms ease}
button:not(:disabled):hover,a:hover{filter:brightness(.97)}
button:not(:disabled):active,a:active{transform:scale(.98)}
label{transition:border-color 120ms ease,background-color 120ms ease}
label:hover{border-color:#767780}
@keyframes ch-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ch-fill{from{width:0}}
@keyframes ch-ring{from{stroke-dashoffset:var(--ch-len)}}
@keyframes ch-num{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ch-pip{0%,100%{box-shadow:0 0 0 0 rgba(228,103,10,.45)}50%{box-shadow:0 0 0 7px rgba(228,103,10,0)}}
@keyframes ch-pop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:none}}
@keyframes ch-glow{from{box-shadow:0 0 0 0 rgba(228,103,10,.55)}to{box-shadow:0 0 0 40px rgba(228,103,10,0)}}
@media (prefers-reduced-motion:reduce){.ch-stack>*,.ch-fill,.ch-ring,.ch-num,.ch-next,.ch-pop,.ch-glow{animation:none}button,a,label{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FCFCFF; display: flex; flex-direction: column; padding: 56px 16px 24px 16px; gap: 24px; align-items: center">
  <div style="display: flex; align-items: center; gap: 12px; width: 100%">
    <div style="width: 32px; height: 32px; border-radius: 8px; background: #2A45C9; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 700; font-size: 14px">W</div>
    <div style="font-size: 14px; font-weight: 600; color: #45464F">Wiesner Aktiv</div>
    <div style="flex-grow: 1"></div>
    <div style="font-size: 12px; font-weight: 600; color: #45464F">Schritt 9 von 9</div>
  </div>
  <div style="flex-grow: 1"></div>
  <div class="ch-pop" style="position: relative; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center">
    <svg width="200" height="200" viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="88" fill="none" stroke="#FFDFC2" stroke-width="14"></circle>
      <circle cx="100" cy="100" r="88" fill="none" stroke="#E4670A" stroke-width="14" stroke-linecap="round" class="ch-ring" style="--ch-len: 553" stroke-dasharray="553 553" stroke-dashoffset="0" transform="rotate(-90 100 100)"></circle>
    </svg>
    <div class="ch-glow" style="position: absolute; width: 132px; height: 132px; border-radius: 999px; background: #FFDFC2; display: flex; align-items: center; justify-content: center">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#331100" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18c3-8 7-11 16-12-1 9-4 13-12 16"></path><path d="M4 18l4-4"></path><path d="M9 15c1.5-.5 3-2 4-3.5"></path></svg>
    </div>
  </div>
  <div class="ch-stack" style="display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center">
    <div style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #E4670A">Abzeichen verdient</div>
    <h1 style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-size: 45px; line-height: 52px; font-weight: 700">Erster Tag</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px; color: #45464F; max-width: 300px">Schön, dass du dabei bist. Dein Check-in zählt schon zum gemeinsamen Ziel „Gemeinsam nach Bregenz“.</p>
  </div>
  <div class="ch-stack" style="display: flex; gap: 8px; align-items: center">
    <div style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #FFDFC2; color: #331100; font-size: 14px; font-weight: 600">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#E4670A" aria-hidden="true"><path d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 1-3s0 3 2 3c2 0 0-5 2-10z"></path></svg>
      1 Tag Serie
    </div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #DFE1FF; color: #000F5C; font-size: 14px; font-weight: 600">+10 Punkte</div>
  </div>
  <div style="flex-grow: 1"></div>
  <div style="display: flex; flex-direction: column; gap: 12px; width: 100%">
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 999px; background: #2A45C9; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">Zur Startseite</a>
    <button type="button" style="height: 48px; border-radius: 999px; border: none; background: transparent; color: #2A45C9; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">Zum Startbildschirm hinzufügen</button>
  </div>
</div>
</x-dc>
