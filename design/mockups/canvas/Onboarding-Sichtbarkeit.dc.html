<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#FCFCFF;color:#1A1B21}
a{color:#2A45C9}a:hover{color:#05157A}

.ch-stack > *{animation:ch-rise 320ms cubic-bezier(.2,.7,.2,1) both}
.ch-stack > :nth-child(2){animation-delay:50ms}.ch-stack > :nth-child(3){animation-delay:100ms}.ch-stack > :nth-child(4){animation-delay:150ms}.ch-stack > :nth-child(5){animation-delay:200ms}.ch-stack > :nth-child(6){animation-delay:250ms}.ch-stack > :nth-child(7){animation-delay:300ms}.ch-stack > :nth-child(8){animation-delay:350ms}.ch-stack > :nth-child(9){animation-delay:400ms}.ch-stack > :nth-child(10){animation-delay:450ms}
.ch-fill{animation:ch-fill 900ms cubic-bezier(.2,.7,.2,1) 200ms both}
.ch-ring{animation:ch-ring 1000ms cubic-bezier(.2,.7,.2,1) 250ms both}
.ch-num{animation:ch-num 600ms cubic-bezier(.2,.7,.2,1) 500ms both}
.ch-next{animation:ch-pip 2400ms ease-in-out 1400ms infinite}
.ch-pop{animation:ch-pop 520ms cubic-bezier(.2,.9,.3,1.15) 100ms both}
.ch-glow{animation:ch-glow 1000ms ease-out 900ms both}
button,a{transition:background-color 120ms ease,color 120ms ease,border-color 120ms ease,transform 120ms ease,box-shadow 120ms ease,filter 120ms ease}
button:not(:disabled):hover,a:hover{filter:brightness(.97)}
button:not(:disabled):active,a:active{transform:scale(.98)}
label{transition:border-color 120ms ease,background-color 120ms ease}
label:hover{border-color:#767780}
@keyframes ch-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ch-fill{from{width:0}}
@keyframes ch-ring{from{stroke-dashoffset:var(--ch-len)}}
@keyframes ch-num{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ch-pip{0%,100%{box-shadow:0 0 0 0 rgba(228,103,10,.45)}50%{box-shadow:0 0 0 7px rgba(228,103,10,0)}}
@keyframes ch-pop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:none}}
@keyframes ch-glow{from{box-shadow:0 0 0 0 rgba(228,103,10,.55)}to{box-shadow:0 0 0 40px rgba(228,103,10,0)}}
@media (prefers-reduced-motion:reduce){.ch-stack>*,.ch-fill,.ch-ring,.ch-num,.ch-next,.ch-pop,.ch-glow{animation:none}button,a,label{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FCFCFF; display: flex; flex-direction: column; padding: 56px 16px 24px 16px; gap: 20px">

  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px">

    <p style="margin: 0; font-size: 16px; line-height: 24px; color: #45464F">Du entscheidest das selbst. Deine Beiträge zählen in jedem Fall zum gemeinsamen Ziel.</p>

      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#45464F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>

      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#45464F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><circle cx="17" cy="9" r="3"></circle><path d="M16 15.5a5.5 5.5 0 0 1 5.5 4.5"></path></svg>
    </label>
    <label style="display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 12px; border: 1px solid #C6C6D0; background: #FFFFFF; cursor: pointer">
      <input type="radio" name="sicht" value="firma" style="margin: 4px 0 0 0; width: 20px; height: 20px; accent-color: #2A45C9">
      <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
        <div style="font-size: 18px; line-height: 24px; font-weight: 600">Ganze Firma</div>
        <div style="font-size: 14px; line-height: 20px; color: #45464F">Zusätzlich erscheinst du in firmenweiten Ständen und im Feed für alle bei Wiesner.</div>
      </div>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#45464F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"></path><path d="M5 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16"></path><path d="M15 10h3a1 1 0 0 1 1 1v10"></path><path d="M8 8h2M8 12h2M8 16h2"></path></svg>
    </label>
  </div>
  <div style="flex-grow: 1"></div>
  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 14px; line-height: 20px; color: #45464F; text-align: center">Du kannst das jederzeit unter „Ich“ ändern. Es gibt keine Vorauswahl.</div>
    <button type="button" disabled style="height: 52px; border-radius: 999px; border: none; background: #E9EAF2; color: #767780; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600; cursor: not-allowed">Weiter</button>
  </div>
</div>
